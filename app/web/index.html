<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<meta name="description" content="監査業務・証跡管理（Mirai Audit Workpaper）— 監査計画・証憑・調書・指摘・改善確認を証跡とともに管理します。" />
<meta name="robots" content="noindex,nofollow" />
<title>監査業務・証跡管理 | Mirai Audit Workpaper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1b18'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E7%9B%A3%3C/text%3E%3C/svg%3E" />
<style>
/* ═══════════ デザイントークン（WebUI v2 改編：明るくモダン / modern-minimal） ═══════════ */
:root{
  --bg:      oklch(99% 0.002 240);
  --surface: oklch(100% 0 0);
  --fg:      oklch(18% 0.012 250);
  --muted:   oklch(54% 0.012 250);
  --border:  oklch(92% 0.005 250);
  --accent:  oklch(58% 0.18 255);

  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;

  /* 派生トーン（生のhexはここ以外で使わない） */
  --accent-soft:  color-mix(in oklch, var(--accent) 12%, transparent);
  --accent-faint: color-mix(in oklch, var(--accent) 6%, transparent);
  --fg-soft:      color-mix(in oklch, var(--fg) 6%, transparent);
  --fg-faint:     color-mix(in oklch, var(--fg) 3%, transparent);
  --surface-2:    color-mix(in oklch, var(--bg) 55%, var(--surface));
  --ring:         color-mix(in oklch, var(--accent) 30%, transparent);

  /* セマンティック状態色 */
  --ok:     oklch(50% 0.12 158);  --ok-bg:     color-mix(in oklch, var(--ok) 12%, var(--surface));
  --warn:   oklch(56% 0.13 70);   --warn-bg:   color-mix(in oklch, var(--warn) 14%, var(--surface));
  --err:    oklch(52% 0.17 27);   --err-bg:    color-mix(in oklch, var(--err) 12%, var(--surface));
  --info:   oklch(52% 0.11 235);  --info-bg:   color-mix(in oklch, var(--info) 12%, var(--surface));
  --purple: oklch(48% 0.15 295);  --purple-bg: color-mix(in oklch, var(--purple) 12%, var(--surface));

  /* 寸法 */
  --radius: 10px; --radius-lg: 14px; --radius-pill: 999px;
  --shadow-sm: 0 1px 2px oklch(18% 0.012 250 / 0.06);
  --shadow-md: 0 14px 36px oklch(18% 0.012 250 / 0.14);
  --topbar-h: 62px; --sidebar-w: 236px;
}

/* ═══════════ リセット・ベース ═══════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
p{text-wrap:pretty}
h1,h2,h3,h4{text-wrap:balance}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.ic{width:18px;height:18px;flex:0 0 auto}

/* ═══════════ アプリシェル ═══════════ */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;height:var(--topbar-h);display:flex;align-items:center;gap:14px;padding:0 20px;background:color-mix(in oklch, var(--surface) 88%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--surface);display:grid;place-items:center;font-size:15px;font-weight:700;flex:0 0 auto}
.brand-name{font-family:var(--font-display);font-size:16.5px;font-weight:650;letter-spacing:-0.02em;white-space:nowrap}
.brand-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.hamburger{display:none;width:42px;height:42px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);align-items:center;justify-content:center}
.top-search{flex:1;max-width:420px;margin-left:8px;position:relative}
.top-search input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--bg);font-size:13.5px}
.top-search input::placeholder{color:var(--muted)}
.top-search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.top-spacer{flex:1}
.env-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);background:var(--fg-faint);color:var(--muted);font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;font-weight:600}
.env-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.userchip{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border-radius:var(--radius-pill)}
.userchip .ava{width:30px;height:30px;border-radius:50%;background:var(--fg-soft);color:var(--fg);display:grid;place-items:center;font-size:12px;font-weight:700}
.userchip .uc-name{font-size:13px;font-weight:600;line-height:1.25}
.userchip .uc-role{font-size:11px;color:var(--muted);line-height:1.25}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.icon-btn:hover{color:var(--fg);border-color:var(--muted)}

.layout{flex:1;display:flex;align-items:stretch;min-height:0}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);padding:14px 12px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow-y:auto;z-index:30}
.side-group{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:16px 10px 6px}
.side-group:first-child{margin-top:4px}
.side-link{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius);color:var(--fg);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap}
.side-link .ic{flex:0 0 auto;color:var(--muted);transition:color .15s}
.side-link:hover{background:var(--fg-faint)}
.side-link:hover .ic{color:var(--fg)}
.side-link.active{background:var(--fg-soft);font-weight:600}
.side-link.active .ic{color:var(--fg)}
.side-link .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--fg-faint);border-radius:var(--radius-pill);padding:1px 8px}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.side-summary{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.side-summary .ss-title{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ss-row{display:flex;justify-content:space-between;font-size:12px;padding:2.5px 0}
.ss-row b{font-family:var(--font-mono);font-weight:600}
.side-toggle{display:flex;align-items:center;gap:8px;padding:8px 10px;border:0;border-radius:var(--radius);background:transparent;color:var(--muted);font-size:12.5px;transition:background .15s}
.side-toggle:hover{background:var(--fg-faint);color:var(--fg)}
.sidebar.collapsed{width:64px;flex-basis:64px}
.sidebar.collapsed .side-link{justify-content:center;padding:10px 0}
.sidebar.collapsed .lbl,.sidebar.collapsed .side-group,.sidebar.collapsed .side-toggle span,.sidebar.collapsed .cnt,.sidebar.collapsed .side-summary{display:none}
.main{flex:1;min-width:0;padding:26px clamp(16px,3vw,36px) 60px;max-width:1320px;margin:0 auto;width:100%}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.breadcrumb a{cursor:pointer;color:var(--muted);transition:color .15s}
.breadcrumb a:hover{color:var(--accent)}
.breadcrumb .sep{color:var(--border);font-family:var(--font-mono)}
.breadcrumb .cur{color:var(--fg);font-weight:600}

/* ═══════════ 見出し・ボタン・カード ═══════════ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-family:var(--font-display);font-size:clamp(24px,2.6vw,30px);font-weight:700;letter-spacing:-0.02em;line-height:1.25;margin:0}
.page-desc{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:64ch}
.page-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card-title{font-family:var(--font-display);font-size:16.5px;font-weight:650;letter-spacing:-0.01em;margin:0}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;letter-spacing:-0.005em;transition:background .15s,border-color .15s,transform .06s;min-height:40px}
.btn:active{transform:translateY(1px)}
.btn:hover{border-color:color-mix(in oklch, var(--muted) 50%, var(--border))}
.btn .ic{width:16px;height:16px}
.btn-primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn-primary:hover{background:color-mix(in oklch, var(--accent) 86%, var(--fg))}
.btn-secondary{background:var(--surface);color:var(--fg);border-color:var(--border)}
.btn-secondary:hover{border-color:color-mix(in oklch, var(--muted) 55%, var(--border))}
.btn-ghost{background:transparent;color:var(--muted);border-color:transparent;padding-inline:10px}
.btn-ghost:hover{color:var(--fg)}
.btn-danger{background:color-mix(in oklch, var(--err) 10%, var(--surface));color:var(--err);border-color:color-mix(in oklch, var(--err) 28%, var(--border))}
.btn-danger:hover{background:color-mix(in oklch, var(--err) 16%, var(--surface))}
.btn-sm{padding:6px 12px;font-size:12.5px;min-height:32px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-sub{font-size:12.5px;color:var(--muted)}
.rule{border:0;border-top:1px solid var(--border);margin:0}

/* ═══════════ KPI ═══════════ */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-sm)}
.kpi-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.kpi-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:650;letter-spacing:-0.03em;line-height:1}
.kpi-num small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi-foot{font-size:11.5px;color:var(--muted);margin-top:9px}
.kpi.tone-ok .kpi-num{color:var(--ok)}
.kpi.tone-warn .kpi-num{color:var(--warn)}
.kpi.tone-err .kpi-num{color:var(--err)}

/* ═══════════ パイプライン ═══════════ */
.pipeline{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.pipeline-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pipeline-pct{font-family:var(--font-mono);font-size:26px;font-weight:650;letter-spacing:-0.02em}
.pipeline-pct small{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stage{position:relative;padding-top:22px}
.stage .track{height:7px;border-radius:var(--radius-pill);background:var(--fg-faint);overflow:hidden}
.stage .fill{height:100%;border-radius:var(--radius-pill);background:var(--accent)}
.stage .st-label{position:absolute;top:0;left:0;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.stage .st-cnt{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:6px}
.stage.now .st-label{color:var(--accent)}
.stage.now .track{background:var(--accent-faint)}
.stage.now .st-cnt{color:var(--accent);font-weight:600}
.stage.done .st-label{color:var(--fg)}
.st-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px;animation:stPulse 2.2s ease-in-out infinite}
@keyframes stPulse{0%,100%{opacity:1}50%{opacity:.35}}
.rail-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--muted)}
.rail-legend b{font-family:var(--font-mono);font-weight:600;color:var(--fg)}
.milestone{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);font-size:13px;color:var(--fg)}
.ms-dot{width:8px;height:8px;border-radius:50%;background:var(--info);flex:0 0 auto}

/* ═══════════ グリッド・テーブル・バッジ ═══════════ */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
.grid-1-2{display:grid;grid-template-columns:1fr 2fr;gap:18px;align-items:start}
.stack>*+*{margin-top:14px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--border)}
th{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--bg)}
tbody tr{transition:background .12s}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--fg-faint)}
tbody tr:last-child td{border-bottom:0}
td .sub{font-size:12px;color:var(--muted)}
.empty{padding:34px 0;text-align:center;color:var(--muted);font-size:13.5px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-pill);padding:2.5px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;line-height:1.6;white-space:nowrap}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-gray{background:color-mix(in oklch, var(--muted) 11%, var(--surface));color:var(--muted)}
.b-green{background:var(--ok-bg);color:var(--ok)}
.b-amber{background:var(--warn-bg);color:var(--warn)}
.b-red{background:var(--err-bg);color:var(--err)}
.b-blue{background:var(--info-bg);color:var(--info)}
.b-purple{background:var(--purple-bg);color:var(--purple)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);transition:background .15s,border-color .15s,color .15s;min-height:34px}
.chip:hover{border-color:color-mix(in oklch, var(--muted) 45%, var(--border));color:var(--fg)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.chip .cnt{font-family:var(--font-mono);font-size:11px;background:color-mix(in oklch, currentColor 14%, transparent);border-radius:var(--radius-pill);padding:0 7px}
.chip.on .cnt{background:color-mix(in oklch, var(--surface) 20%, transparent)}
.chipbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

/* ═══════════ フォーム・プログレス・アイテム ═══════════ */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,.select,.textarea{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:14px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);outline:none}
.textarea{min-height:84px;resize:vertical;line-height:1.6}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.form-err{font-size:12.5px;color:var(--err);font-weight:600;margin:6px 0 0}
.pbar{height:6px;border-radius:var(--radius-pill);background:var(--fg-faint);overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--info)}
.pbar i.ok{background:var(--ok)}
.pbar i.warn{background:var(--warn)}
.pbar i.err{background:var(--err)}
.item{border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:12px;background:var(--surface);transition:border-color .15s}
.item:hover{border-color:color-mix(in oklch, var(--muted) 30%, var(--border))}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.item-title{font-size:14.5px;font-weight:650;letter-spacing:-0.005em}
.item-meta{font-size:12.5px;color:var(--muted);margin:3px 0}
.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sub-list{margin-top:10px;border-top:1px dashed var(--border);padding-top:9px}
.sub-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:3px 0;flex-wrap:wrap}
.detail-list{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.detail-row{font-size:12.5px;color:var(--muted);padding:3.5px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.detail-row b{font-family:var(--font-mono);font-weight:600;color:var(--fg);font-size:12px;min-width:92px}
.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.meta-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px}
.meta-cell .k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.meta-cell .v{font-size:14px;font-weight:600;line-height:1.4}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 16px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;min-height:44px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);margin-left:5px}
.tab.on .cnt{color:var(--accent)}
.log-row{display:grid;grid-template-columns:150px 1fr 120px;gap:16px;padding:13px 0;border-top:1px solid var(--border);align-items:baseline}
.log-row .when{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.log-row .what{font-size:13.5px}
.log-row .who{font-size:12px;color:var(--muted);text-align:right}

/* ═══════════ ログイン ═══════════ */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-side{position:relative;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}
.login-form{display:flex;align-items:center;justify-content:center;padding:clamp(28px,5vw,64px)}
.login-form-inner{width:100%;max-width:400px}
.login-title{font-family:var(--font-display);font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-0.02em;line-height:1.3;margin:0 0 12px}
.login-lead{color:var(--muted);font-size:14.5px;margin:0 0 26px}
.demo-box{border:1px dashed color-mix(in oklch, var(--muted) 42%, var(--border));background:var(--fg-faint);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:22px}
.demo-box .db-title{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:9px}
.demo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.demo-user{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid transparent;border-radius:var(--radius);background:var(--surface);font-size:12.5px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;min-height:42px}
.demo-user:hover{border-color:var(--accent)}
.demo-user.on{border-color:var(--accent);background:var(--accent-soft)}
.demo-user .du-name{font-weight:600;line-height:1.2}
.demo-user .du-role{font-size:11px;color:var(--muted);line-height:1.2}
.demo-user .ava{width:26px;height:26px;border-radius:50%;background:var(--fg-soft);color:var(--fg);display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:0 0 auto}
.role-list{margin:34px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.role-list li{display:flex;gap:13px;align-items:flex-start}
.role-list .rl-ic{width:34px;height:34px;border-radius:10px;background:var(--fg-soft);color:var(--fg);display:grid;place-items:center;flex:0 0 auto}
.role-list .rl-ic .ic{width:17px;height:17px}
.role-list b{display:block;font-size:14px}
.role-list span{font-size:12.5px;color:var(--muted);line-height:1.5}
.login-foot{margin-top:auto;padding-top:40px;font-size:12px;color:var(--muted)}

/* ═══════════ モーダル・トースト・フッター ═══════════ */
.modal-backdrop{position:fixed;inset:0;background:oklch(18% 0.012 250 / 0.45);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 32px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-md);width:100%;max-width:540px;animation:modalIn .18s cubic-bezier(0.23,1,0.32,1)}
.modal.wide{max-width:720px}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 14px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:650;letter-spacing:-0.01em}
.modal-x{width:36px;height:36px;border:0;background:transparent;border-radius:var(--radius);display:grid;place-items:center;color:var(--muted)}
.modal-x:hover{background:var(--fg-faint);color:var(--fg)}
.modal-body{padding:18px 22px;max-height:62vh;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--border)}
#toast-root{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--surface);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-md);font-size:13.5px;animation:toastIn .2s cubic-bezier(0.23,1,0.32,1);max-width:420px}
.toast.t-ok{background:var(--ok)}
.toast.t-err{background:var(--err)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pagefoot{padding:22px clamp(16px,3vw,36px) 34px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

/* ═══════════ レスポンシブ・アクセシビリティ ═══════════ */
@media(max-width:1180px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.meta-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:980px){
  .hamburger{display:inline-flex}
  .sidebar{position:fixed;left:0;top:var(--topbar-h);bottom:0;transform:translateX(-105%);transition:transform .22s cubic-bezier(0.23,1,0.32,1);width:var(--sidebar-w);flex-basis:auto;height:auto;box-shadow:var(--shadow-md)}
  .sidebar.open{transform:translateX(0)}
  .side-backdrop{position:fixed;inset:0;background:oklch(18% 0.012 250 / 0.32);z-index:25;display:none}
  .side-backdrop.show{display:block}
  .grid-2,.grid-2-1,.grid-1-2{grid-template-columns:1fr}
  .rail{grid-template-columns:repeat(3,1fr);row-gap:18px}
  .login-wrap{grid-template-columns:1fr}
  .login-side{display:none}
  .top-search{display:none}
}
@media(max-width:720px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .userchip .uc-name,.userchip .uc-role{display:none}
  .env-pill{display:none}
  .page-head{align-items:flex-start;flex-direction:column}
  .row-2,.row-3{grid-template-columns:1fr}
  .log-row{grid-template-columns:1fr;gap:2px}
  .log-row .who{text-align:left}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .topbar,.sidebar,.breadcrumb,.page-actions,.tabbar,.chipbar,.modal-backdrop{display:none!important}
  body{background:var(--surface)}
  .card,.kpi,.pipeline,.item,.meta-cell{border:1px solid var(--border);box-shadow:none;break-inside:avoid}
}
</style>
</head>

// ===================== API クライアント（変更なし） =====================
async function api(path, opts={}){
  const res = await fetch(path, {...opts, headers:{"Content-Type":"application/json", ...(opts.headers||{})}, credentials:"same-origin"});
  if(!res.ok){ let m=`エラー (${res.status})`; try{const b=await res.json(); if(b.error?.message)m=b.error.message;}catch{} throw new Error(m); }
  if(res.status===204) return null; return res.json();
}

// ===================== 定数・表示辞書（変更なし） =====================

const UI_PERM={

const uiCan=(role,perm)=>(UI_PERM[role]||[]).includes(perm);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateFmt=s=>s?new Date(s).toLocaleString("ja-JP"):"—";
const dateOnly=s=>s?new Date(s).toLocaleDateString("ja-JP"):"—";
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{ const x=new Date(); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const isOverdue=d=>!!d && String(d).slice(0,10) < todayStr();
const stLabel=s=>ST[s]||s;
const badge=s=>`<span class="badge ${BADGE[s]||"b-gray"}">${esc(stLabel(s))}</span>`;
const sevLabel=s=>s==="high"?"高":s==="medium"?"中":s==="low"?"低":s;
const sevColor=s=>s==="high"?"var(--err)":s==="medium"?"var(--warn)":"var(--info)";
const fmtDue=d=>{ if(!d) return '<span class="muted">—</span>'; const ov=isOverdue(d); return `<span class="num" style="${ov?"color:var(--err);font-weight:700;":""}">${dateOnly(d)}</span>${ov?' <span class="badge b-red">期限超過</span>':""}`; };
const TASK_TYPE_JA=t=>TASK_TYPE[t]||t;
const pbar=(pct,tone)=>{ const t=tone?` ${tone}`:""; return `<span class="pbar"><i class="${t}" style="width:${Math.max(0,Math.min(100,pct))}%"></i></span>`; };

// ===================== 状態・ルーティング =====================
let state={me:null, query:"", envLabel:"デモ"};
const cache={plans:[],planDetail:null,engs:[],engDetail:null,engDetails:{},requests:[],events:[],users:[],adminUsers:[],engFilter:null};
let renderSeq=0;
const app=document.getElementById("app");
const modalRoot=document.getElementById("modal-root");
const toastRoot=document.getElementById("toast-root");
let modalState=null;

function parseHash(){
  const raw=(location.hash||"").replace(/^#\/?/,"");
  const parts=raw.split("/").filter(Boolean);
  const r={view:"home",id:null,tab:null,extra:null};
  if(parts[0]==="plans"){r.view="plans";r.id=parts[1]||null;}
  else if(parts[0]==="engagements"){r.view="engagements";r.id=parts[1]||null;r.tab=parts[2]||null;}
  else if(parts[0]==="requests"){r.view="requests";r.extra=parts[1]||null;}
  else if(parts[0]==="auditlog"){r.view="auditlog";}
  else if(parts[0]==="users"){r.view="users";}
  return r;
}
function buildHash(view,id,tab,extra){let h="#/"+view;if(id)h+="/"+id;if(tab)h+="/"+tab;if(extra&&!id&&!tab)h+="/"+extra;return h;}
function navigate(view,id,tab,extra){
  closeModal(); // 画面遷移時のみモーダルを閉じる（データ再描画では閉じない）
  // モバイルでは遷移時にメニューを自動クローズ
  const sb=document.getElementById("sidebar"), bd=document.getElementById("side-backdrop");
  sb?.classList.remove("open"); bd?.classList.remove("show");
  const h=buildHash(view,id,tab,extra);
  if(location.hash===h){render();}else{location.hash=h;}
  try{window.scrollTo(0,0);}catch{}
}

function openModal({title,body,okLabel="実行",okClass="btn-primary",onOk=null,wide=false}){
  modalState={onOk};
  modalRoot.innerHTML=`
    <div class="modal-backdrop" data-modal="close">
      <div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-x" data-modal="close" aria-label="閉じる">${ic("x")}</button></div>
        <div class="modal-body">${body}<p class="form-err" id="modal-err" style="display:none"></p></div>
        <div class="modal-foot">
          <button class="btn btn-secondary" data-modal="close">キャンセル</button>
          <button class="btn ${okClass}" id="modal-ok">${esc(okLabel)}</button>
        </div>
      </div>
    </div>`;
  const okBtn=document.getElementById("modal-ok");
  okBtn.onclick=()=>{ if(modalState?.onOk) modalState.onOk(okBtn); };
  const bodyEl=modalRoot.querySelector(".modal-body");
  bodyEl.addEventListener("keydown",ev=>{
    if(ev.key==="Enter" && ev.target.tagName!=="TEXTAREA" && !ev.target.matches("button")){ev.preventDefault();okBtn.click();}
  });
  const first=bodyEl.querySelector("input,select,textarea"); if(first) setTimeout(()=>first.focus(),60);
  const onKey=ev=>{ if(ev.key==="Escape") closeModal(); };
  document.addEventListener("keydown",onKey);
  modalState.onKey=onKey;
}
function closeModal(){ if(modalState?.onKey) document.removeEventListener("keydown",modalState.onKey); modalRoot.innerHTML=""; modalState=null; }
function modalErr(msg){const el=document.getElementById("modal-err");if(el){el.style.display="";el.textContent=msg||"";}}
function confirmModal(message,onYes,yesLabel="実行する",danger=true){
  openModal({title:"確認",body:`<p style="margin:2px 0;font-size:14px">${esc(message)}</p>`,okLabel:yesLabel,okClass:danger?"btn-danger":"btn-primary",onOk:()=>{closeModal();onYes();}});
}

// 各ビューのデータ取得（取得後に再描画）
function loadViewData(route){
  const seq=renderSeq;
  const done=()=>{ if(seq===renderSeq) render(true); };
  const role=state.me.user.role;
  try{
    if(route.view==="home"){
      // ダッシュボード: 計画・案件・依頼・ログを並列取得し、実施中案件の詳細(調書・指摘)を限定的に取得
      Promise.all([
        uiCan(role,"plan:view")?A.plans().catch(()=>null):Promise.resolve(null),
        uiCan(role,"engagement:view")?A.engagements().catch(()=>null):Promise.resolve(null),
        uiCan(role,"request:view")?A.requests().catch(()=>null):Promise.resolve(null),
        uiCan(role,"auditlog:view")?A.auditEvents("?limit=6").catch(()=>null):Promise.resolve(null),
      ]).then(([pl,en,rq,ev])=>{
        if(pl) cache.plans=pl.plans; if(en) cache.engs=en.engagements; if(rq) cache.requests=rq.requests; if(ev) cache.events=ev.events;
        const ids=(en?.engagements||[]).filter(e=>["in_progress","review","pending_approval"].includes(e.status)).map(e=>e.id);
        return Promise.all(ids.map(id=>A.engagement(id).catch(()=>null))).then(details=>{
          const map={}; for(const d of details){ if(d?.engagement) map[d.engagement.id]=d; }
          cache.engDetails=map; done();
        });
      }).catch(()=>done());
    }
    else if(route.view==="plans" && route.id) A.plan(route.id).then(x=>{cache.planDetail=x;done();}).catch(e=>{toast(e.message,"err");});
    else if(route.view==="plans") {
      // 計画一覧: 案件数表示のため、権限がある場合は案件も並列取得
      const engReq = uiCan(role,"engagement:view") ? A.engagements().catch(()=>null) : Promise.resolve(null);
      Promise.all([A.plans(), engReq]).then(([pl,en])=>{ cache.plans=pl.plans; if(en) cache.engs=en.engagements; done(); }).catch(e=>toast(e.message,"err"));
    }
    else if(route.view==="engagements" && !route.id) {
      // 案件一覧と作成フォーム用の計画一覧を1回の更新でまとめて取得（重複描画・無限ループ防止）
      const planReq = uiCan(role,"plan:view") ? A.plans().catch(()=>null) : Promise.resolve(null);
      Promise.all([A.engagements(), planReq])
        .then(([engRes, planRes])=>{ cache.engs=engRes.engagements; if(planRes) cache.plans=planRes.plans; done(); })
        .catch(e=>{toast(e.message,"err");});
    }
    else if(route.view==="engagements" && route.id) A.engagement(route.id).then(x=>{cache.engDetail=x;done();}).catch(e=>{toast(e.message,"err");});
    else if(route.view==="requests") A.requests(route.extra?`?status=${encodeURIComponent(route.extra)}`:"").then(x=>{cache.requests=x.requests;done();}).catch(e=>toast(e.message,"err"));
    else if(route.view==="auditlog"){
      Promise.all([A.auditEvents(), uiCan(role,"users:view")?A.users():Promise.resolve(null)])
        .then(([ev,us])=>{cache.events=ev.events; if(us) cache.users=us.users; done();})
        .catch(e=>toast(e.message,"err"));
    }
    else if(route.view==="users") A.adminUsers().then(x=>{cache.adminUsers=x.users;done();}).catch(e=>toast(e.message,"err"));
  }catch(e){ toast(e.message,"err"); }
}

function kpiHTML(){
  const engs=cache.engs||[], reqs=cache.requests||[];
  const doing=engs.filter(e=>["in_progress","review"].includes(e.status)).length;
  const recv=reqs.filter(r=>["received","partial","closed"].includes(r.status)).length;
  const rate=reqs.length?Math.round(recv/reqs.length*100):0;
  const overdue=reqs.filter(r=>isOverdue(r.due_at)&&!["received","closed"].includes(r.status)).length;
  const details=Object.values(cache.engDetails||{});
  const fnds=details.flatMap(d=>d.findings||[]);
  const wps=details.flatMap(d=>d.workpapers||[]);
  const rems=details.flatMap(d=>(d.findings||[]).flatMap(f=>f.remediations||[]));
  const openFnds=fnds.filter(f=>!["completed"].includes(f.status)).length;
  const highOpen=fnds.filter(f=>f.severity==="high"&&!["completed"].includes(f.status)).length;
  const finalWps=wps.filter(w=>w.status==="final").length;
  const wpsRate=wps.length?Math.round(finalWps/wps.length*100):0;
  const remDone=rems.filter(r=>r.status==="completed").length;
  const remRate=rems.length?Math.round(remDone/rems.length*100):0;
  const k=(id,label,val,unit,foot,tone)=>`<div class="kpi ${tone||""}" data-od-id="${id}">
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-num num">${val}${unit?`<small>${esc(unit)}</small>`:""}</div>
    <div class="kpi-foot">${esc(foot)}</div></div>`;
  return `<div class="kpi-grid">
    ${k("kpi-ongoing","実施中案件",doing,"件","関与案件のうち", "tone-ok")}
    ${k("kpi-submission","証憑提出率",rate,"%","依頼"+reqs.length+"件・受領済"+recv+"件","")}
    ${k("kpi-overdue","期限超過",overdue,"件","早急な対応が必要です","tone-err")}
    ${k("kpi-findings","未完了指摘",openFnds,"件","重要度高 "+highOpen+"件","tone-warn")}
    ${k("kpi-workpaper","調書確定率",wpsRate,"%","確定"+finalWps+"件 / "+wps.length+"件","")}
    ${k("kpi-remediation","是正完了率",remRate,"%","完了"+remDone+"件 / "+rems.length+"件","")}
  </div>`;
}
function pipelineHTML(){
  const engs=cache.engs||[];
  const details=Object.values(cache.engDetails||{});
  const hasWp=eid=>details.some(d=>d.engagement?.id===eid&&(d.workpapers||[]).length>0);
  const hasReviewedWp=eid=>details.some(d=>d.engagement?.id===eid&&(d.workpapers||[]).some(w=>w.status==="final"||w.status==="review_requested"));
  const hasFinding=eid=>details.some(d=>d.engagement?.id===eid&&(d.findings||[]).some(f=>["confirmed","remediated","completed"].includes(f.status)));
  const atOrBeyond=(statuses)=>engs.filter(e=>statuses.includes(e.status)).length;
  const total=engs.length||1;
  const fills=[
    Math.round((cache.plans.filter(p=>p.status==="approved").length/(cache.plans.length||1))*100), /* 計画: 承認済み計画 */
    Math.round(atOrBeyond(["in_progress","review","reported","closed"])/total*100),               /* 実施: 実施段階以降 */
    Math.round(engs.filter(e=>hasWp(e.id)).length/total*100),                                     /* 調書: 調書あり案件 */
    Math.round(engs.filter(e=>hasReviewedWp(e.id)).length/total*100),                             /* レビュー: 依頼中+確定 */
    Math.round(engs.filter(e=>hasFinding(e.id)).length/total*100),                                /* 指摘: 確定以降 */
    Math.round(atOrBeyond(["closed"])/total*100),                                                 /* 完了: 締切案件 */
  ];
  const names=["計画","実施","調書","レビュー","指摘","完了"];
  const nowIdx=fills.findIndex(f=>f<100);
  const cells=names.map((n,i)=>{
    const cls=i===nowIdx?"now":i<nowIdx?"done":"";
    const fill=i<nowIdx?100:i===nowIdx?fills[i]:0;
    const cnt=i>nowIdx?"—":(i<nowIdx?100:fills[i])+"%";
    return `<div class="stage ${cls}" data-od-id="pipeline-stage-${i}">
      <div class="st-label">${i===nowIdx?'<span class="st-dot"></span>':""}${n}</div>
      <div class="track"><div class="fill" style="width:${fill}%"></div></div>
      <div class="st-cnt num">${cnt}</div></div>`;
  }).join("");
  const pendEng=engs.find(e=>e.status==="pending_approval");
  const overdueN=(cache.requests||[]).filter(r=>isOverdue(r.due_at)&&!["received","closed"].includes(r.status)).length;
  const milestone=pendEng?`次のマイルストーン: ${esc(pendEng.engagement_no)} ${esc(pendEng.title)}（${stLabel(pendEng.status)}）`:overdueN?`期限超過の依頼が ${overdueN}件 — 督促とフォローが必要です`:`全案件が計画どおり進行中です`;
  const doing=engs.filter(e=>["in_progress","review"].includes(e.status)).length;
  return `<section class="pipeline" data-od-id="dashboard-pipeline">
    <div class="pipeline-head">
      <div><p class="eyebrow" style="color:var(--muted)">監査パイプライン</p><h2 class="card-title" style="font-size:18px">監査の全体進捗</h2></div>
      <div class="pipeline-pct num">${Math.round(fills.reduce((a,b)=>a+b,0)/fills.length)}<small>%</small></div>
    </div>
    <div class="rail">${cells}</div>
    <div class="rail-legend">案件 <b class="num">${engs.length}件</b> ・ 実施中 <b class="num">${doing}件</b> ・ 完了 <b class="num">${engs.filter(e=>e.status==="closed").length}件</b></div>
    <div class="milestone"><span class="ms-dot"></span>${milestone}</div>
  </section>`;
}
function donutHTML(){
  const reqs=cache.requests||[];
  const segs=[["送付済",reqs.filter(r=>r.status==="sent").length,"var(--info)"],["一部受領",reqs.filter(r=>r.status==="partial").length,"var(--warn)"],["受領済",reqs.filter(r=>r.status==="received").length,"var(--ok)"],["差戻し",reqs.filter(r=>r.status==="returned").length,"var(--err)"],["下書き・締切",reqs.filter(r=>["draft","closed"].includes(r.status)).length,"var(--muted)"]];
  const total=reqs.length||1;
  const R=42, C=2*Math.PI*R;
  let acc=0;
  const arcs=segs.map(s=>{
    const frac=s[1]/total, len=frac*C;
    const off=acc*C; acc+=frac;
    return `<circle r="${R}" cx="60" cy="60" fill="none" style="stroke:${s[2]}" stroke-width="15" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 60 60)"/>`;
  }).join("");
  const legend=segs.map(s=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:8px"><span style="width:9px;height:9px;border-radius:3px;background:${s[2]};flex:0 0 auto"></span>${s[0]}<b class="num" style="margin-left:auto;color:var(--fg)">${s[1]}</b></div>`).join("");
  return `<div class="card" data-od-id="dashboard-requests-donut">
    <div class="card-head"><h2 class="card-title">証憑依頼の状況</h2><span class="card-sub">全${reqs.length}件</span></div>
    <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
      <div style="position:relative;width:120px;height:120px;flex:0 0 auto">
        <svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="依頼ステータス分布">${arcs}</svg>
        <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><div class="num" style="font-size:26px;font-weight:650;line-height:1">${reqs.length}</div><div style="font-size:10.5px;color:var(--muted)">依頼</div></div></div>
      </div>
      <div style="flex:1;min-width:170px">${legend}</div>
    </div>
  </div>`;
}

function overviewHTML(e,d,role){
  const reqs=d.requests||[], wps=d.workpapers||[], fnds=d.findings||[];
  const isAuditee=role==="auditee";
  const subRate=reqs.length?Math.round(reqs.filter(r=>["received","partial","closed"].includes(r.status)).length/reqs.length*100):0;
  const finalWps=wps.filter(w=>w.status==="final").length;
  const highOpen=fnds.filter(f=>f.severity==="high"&&!["completed"].includes(f.status)).length;
  const doneRems=fnds.flatMap(f=>f.remediations||[]).filter(r=>r.status==="completed").length;
  const mini=(k,v,tone)=>`<div class="meta-cell"><div class="k">${k}</div><div class="v num" style="color:${tone}">${v}</div></div>`;

        <p style="margin:0;font-size:13.5px">この案件では、監査役側の検討情報（目的・範囲、評価基準、調書、活動記録）は表示されません。表示対象は自部門宛の<b>証憑依頼</b>と、確定後の<b>指摘・是正</b>のみです。</p>

    : `<div class="card" data-od-id="eng-scope">

      </div>`;
  const summaryCells=isAuditee
    ? `${mini("証憑提出率",subRate+"%","var(--info)")}
       ${mini("重要度高の指摘",highOpen+"件",highOpen?"var(--err)":"var(--ok)")}`

       ${mini("確定調書",finalWps+" / "+wps.length+"件","var(--purple)")}
       ${mini("重要度高の指摘",highOpen+"件",highOpen?"var(--err)":"var(--ok)")}
       ${mini("是正完了",doneRems+"件","var(--ok)")}`;
  const linkedRows=isAuditee
    ? `<div class="detail-row"><b>証憑依頼</b><span>${reqs.length}件（${subRate}%提出）</span></div>
       <div class="detail-row"><b>指摘</b><span>${fnds.length}件（重要度高 ${fnds.filter(f=>f.severity==="high").length}件）</span></div>`
    : `<div class="detail-row"><b>証憑依頼</b><span>${reqs.length}件（${subRate}%提出）</span></div>
       <div class="detail-row"><b>監査調書</b><span>${wps.length}件（確定${finalWps}件）</span></div>
       <div class="detail-row"><b>指摘</b><span>${fnds.length}件（重要度高 ${fnds.filter(f=>f.severity==="high").length}件）</span></div>
       <div class="detail-row"><b>関連計画</b><span>${esc((cache.plans.find(p=>p.id===e.plan_id)||{}).title||"—")}</span></div>`;
  return `<div class="grid-2-1">
    <div class="stack">${leftCol}</div>

function fndsBlockHTML(findings,eid,role,me){

        <div class="item-meta">責任者 ${esc(ownerName(r.owner_id))} ・ 期限 ${fmtDue(r.due_at)}</div>
        ${rb.length?`<div class="item-actions">${rb.join("")}</div>`:""}

      ${lastResp?`<p class="muted small" style="margin:8px 0 0"><b>回答:</b> ${esc(lastResp.response)}${lastResp.disagreement?` <span style="color:var(--err)">（異議: ${esc(lastResp.disagreement)}）</span>`:""}</p>`:""}
      ${btns.length?`<div class="item-actions">${btns.join("")}</div>`:""}

function auditLogHTML(){
  const events=cache.events||[];
  const usersOpts=cache.users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}（${esc(u.department)}）</option>`).join("");
  const actionKeys=Object.keys(ACTION_JA);
  const nSuccess=events.filter(ev=>ev.result==="success").length;
  const nDenied=events.filter(ev=>ev.result==="denied").length;
  const nFailed=events.filter(ev=>ev.result==="failed").length;
  const rows=events.map(ev=>{
    const actor=cache.users.find(u=>u.id===ev.actor_id);
    const rawAction=ev.action.startsWith("permission_denied")?"permission_denied":ev.action;
    return `<tr data-od-id="audit-event-${esc(ev.object_id)}">
      <td class="num">${dateFmt(ev.occurred_at)}</td>
      <td>${actor?`${esc(actor.name)}（${esc(actor.department)}）`:(ev.actor_id?esc(ev.actor_id.slice(0,14)):"—")}</td>
      <td>${ACTION_JA[rawAction]||esc(ev.action)}${ev.action!==rawAction?` <span class="muted small">(${esc(ev.action.split(":")[1])})</span>`:""}</td>
      <td><span class="mono small">${OBJ_JA[ev.object_type]||esc(ev.object_type)}/${esc(ev.object_id.slice(0,16))}</span></td>
      <td>${RESULT_JA[ev.result]==="成功"?`<span class="badge b-green">成功</span>`:RESULT_JA[ev.result]==="拒否"?`<span class="badge b-red">拒否</span>`:`<span class="badge b-amber">${esc(RESULT_JA[ev.result]||ev.result)}</span>`}</td>
      <td>${esc(ev.detail)}</td>
      <td class="num small">${esc(ev.ip)}</td></tr>`;
  }).join("");
  return `<section data-od-id="screen-auditlog">
    <div class="page-head">
      <div><h1 class="page-title">監査ログ</h1><p class="page-desc">追記専用の操作履歴です。閲覧・変更・承認・出力のすべてが記録されます。</p></div>
    </div>
    <div class="meta-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="meta-cell"><div class="k">対象ログ</div><div class="v num">${events.length}件</div></div>
      <div class="meta-cell"><div class="k">成功</div><div class="v num" style="color:var(--ok)">${nSuccess}件</div></div>
      <div class="meta-cell"><div class="k">拒否</div><div class="v num" style="color:${nDenied?"var(--err)":"var(--muted)"}">${nDenied}件</div></div>
      <div class="meta-cell"><div class="k">失敗</div><div class="v num" style="color:${nFailed?"var(--warn)":"var(--muted)"}">${nFailed}件</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2 class="card-title">操作履歴</h2><span class="card-sub">${events.length}件を表示</span></div>
      <div class="chipbar" style="margin-top:0">
        <select class="select" id="log-actor" style="width:auto;min-width:180px"><option value="">操作者（すべて）</option>${usersOpts}</select>
        <select class="select" id="log-action" style="width:auto;min-width:170px"><option value="">操作（すべて）</option>${actionKeys.map(k=>`<option value="${esc(k)}">${ACTION_JA[k]}</option>`).join("")}</select>
        <select class="select" id="log-obj" style="width:auto;min-width:140px"><option value="">対象（すべて）</option>${Object.entries(OBJ_JA).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
        <select class="select" id="log-limit" style="width:auto;min-width:110px"><option value="100">100件</option><option value="200">200件</option><option value="500">500件</option></select>
        <button class="btn btn-secondary btn-sm" data-act="log-apply">${ic("filter")}絞り込み</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>日時</th><th>操作者</th><th>操作</th><th>対象</th><th>結果</th><th>詳細</th><th>IP</th></tr></thead>
        <tbody>${rows||`<tr><td colspan="7" class="empty">ログがありません</td></tr>`}</tbody></table></div>
    </div>
  </section>`;
}

// ===================== アクション =====================
function refreshRoute(){ render(); }

async function runAction(act){
  const a=act.dataset.act, id=act.dataset.id||null;
  try{
    switch(a){
      case "hamburger": {
        const sb=document.getElementById("sidebar"), bd=document.getElementById("side-backdrop");
        sb?.classList.toggle("open"); bd?.classList.toggle("show"); break;
      }
      case "collapse-sidebar": {
        const sb=document.getElementById("sidebar");
        const collapsed=sb?.classList.toggle("collapsed");
        localStorage.setItem("maw.sidebar.collapsed", collapsed?"1":"0"); break;
      }
      case "logout": await A.logout(); state.me=null; navigate("home"); render(); toast("ログアウトしました"); break;
      case "password": openPasswordModal(); break;

      // ---- 監査計画 ----
      case "plan-create": openPlanForm(null); break;
      case "plan-edit": { const p=cache.planDetail?.plan; if(p) openPlanForm(p); break; }
      case "plan-submit": confirmModal("承認申請を提出します。よろしいですか？", async()=>{ await A.submitPlan(id); toast("承認申請しました"); refreshRoute(); },"申請する",false); break;
      case "plan-approve": confirmModal("この計画を承認します。よろしいですか？", async()=>{ await A.approvePlan(id); toast("承認しました"); refreshRoute(); },"承認する",false); break;
      case "plan-reject": confirmModal("この計画を却下します。よろしいですか？", async()=>{ await A.rejectPlan(id); toast("却下しました"); refreshRoute(); }); break;

      // ---- 監査案件 ----
      case "eng-create": openEngForm(null); break;
      case "eng-edit": { const e=cache.engDetail?.engagement; if(e) openEngForm(e); break; }
      case "eng-status": confirmModal(`案件状態を「${stLabel(act.dataset.status)}」へ変更します。よろしいですか？`, async()=>{ await A.setEngStatus(id, act.dataset.status); toast("状態を更新しました"); refreshRoute(); }); break;
      case "eng-filter": cache.engFilter=act.dataset.status==="all"?null:act.dataset.status; render(); break;

      // ---- 証憑依頼 ----
      case "req-create": openReqForm(id); break;
      case "req-send": confirmModal("依頼を被監査部門へ送付します。よろしいですか？", async()=>{ await A.sendRequest(id); toast("送付しました"); refreshRoute(); },"送付する",false); break;
      case "req-receive": confirmModal("証憑を全件受領します。よろしいですか？", async()=>{ await A.receiveRequest(id); toast("受領しました"); refreshRoute(); },"受領する",false); break;
      case "req-return": confirmModal("この依頼を差し戻します。よろしいですか？", async()=>{ await A.returnRequest(id); toast("差し戻しました"); refreshRoute(); }); break;
      case "req-close": confirmModal("この依頼を締め切ります。よろしいですか？", async()=>{ await A.closeRequest(id); toast("締め切りました"); refreshRoute(); }); break;
      case "evidence-submit": openEvidenceForm(id); break;

      // ---- 監査調書 ----
      case "wp-create": openWpForm(id,null); break;
      case "wp-edit": { const w=(cache.engDetail?.workpapers||[]).find(x=>x.id===id); if(w) openWpForm(id,w); break; }
      case "wp-review": confirmModal("レビューを依頼します。よろしいですか？", async()=>{ await A.reqReview(id); toast("レビューを依頼しました"); refreshRoute(); },"依頼する",false); break;
      case "wp-approve": confirmModal("この調書を確定（正本）とします。よろしいですか？", async()=>{ await A.approveWorkpaper(id); toast("確定しました"); refreshRoute(); },"確定する",false); break;
      case "wp-return": confirmModal("この調書を差し戻します。よろしいですか？", async()=>{ await A.returnWorkpaper(id); toast("差し戻しました"); refreshRoute(); }); break;

      // ---- 指摘・是正 ----
      case "fnd-create": openFndForm(id); break;
      case "fnd-confirm": confirmModal("指摘の事実確認（確定）を行います。よろしいですか？", async()=>{ await A.confirmFinding(id,{}); toast("確定しました"); refreshRoute(); }); break;
      case "fnd-respond": openRespForm(id); break;
      case "rem-create": openRemForm(id); break;
      case "rem-status": confirmModal(`是正計画を「${stLabel(act.dataset.status)}」へ更新します。よろしいですか？`, async()=>{ await A.remStatus(id, act.dataset.status); toast("進捗を更新しました"); refreshRoute(); }); break;
      case "rem-verify": openVerifyForm(id); break;

      // ---- 監査ログ ----
      case "log-apply": {
        const p=new URLSearchParams();
        const actor=document.getElementById("log-actor")?.value, act2=document.getElementById("log-action")?.value,
              obj=document.getElementById("log-obj")?.value, lim=document.getElementById("log-limit")?.value;
        if(actor) p.set("actor_id",actor); if(act2) p.set("action",act2); if(obj) p.set("object_type",obj); if(lim) p.set("limit",lim);
        const seq=renderSeq;
        const ev=await A.auditEvents(p.toString()); if(seq===renderSeq){ cache.events=ev.events; render(); }
        break;
      }
      // ---- ユーザー管理 ----
      case "user-create": openUserForm(); break;
      case "user-edit": { const u=cache.adminUsers.find(x=>x.id===id); if(u) openUserEditForm(u); break; }
      case "user-deactivate": confirmModal("このユーザーを無効化します（ログイン不可・既存セッション無効）。よろしいですか？", async()=>{ await A.deactivateUser(id); toast("無効化しました"); refreshRoute(); }); break;
      case "user-activate": confirmModal("このユーザーを再有効化します。よろしいですか？", async()=>{ await A.activateUser(id); toast("再有効化しました"); refreshRoute(); }); break;
      case "user-password": openUserPasswordForm(id); break;
      default: break;
    }
  }catch(e){ toast(e.message,"err"); }
}

      try{ await A.submitEvidence(rid,{file_name:fn,content_hash:hash,note}); closeModal(); toast("提出しました"); refreshRoute(); }

    }});

    <div class="row-3"><div class="field"><label>評価基準</label><input class="input" id="fcrit"></div>
    <div class="field"><label>重要度</label><select class="select" id="fsev"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></div>
    <div class="field"><label>原因</label><input class="input" id="fcause"></div></div>
    <div class="field"><label>影響</label><input class="input" id="fimpact"></div>`,
    onOk:async(btn)=>{
      const fact=val("#ffact");
      if(!fact){modalErr("事実は必須です");return;}
      btn.disabled=true;
      try{ await A.createFinding(eid,{fact,criterion:val("#fcrit"),cause:val("#fcause"),impact:val("#fimpact"),severity:val("#fsev")}); closeModal(); toast("指摘を作成しました"); refreshRoute(); }
      catch(e){ modalErr(e.message); btn.disabled=false; }
    }});
}
function openRespForm(fid){
  openModal({title:"指摘への回答",okLabel:"回答を提出",body:`
    <div class="field"><label>回答・見解</label><textarea class="textarea" id="rr" rows="3"></textarea></div>
    <div class="field"><label>異議（あれば）</label><input class="input" id="rd"></div>`,
    onOk:async(btn)=>{
      const response=val("#rr");
      if(!response){modalErr("回答は必須です");return;}
      btn.disabled=true;
      try{ await A.respondFinding(fid,{response,disagreement:val("#rd")}); closeModal(); toast("回答を提出しました"); refreshRoute(); }
      catch(e){ modalErr(e.message); btn.disabled=false; }
    }});
}
async function openRemForm(fid){
  await ensureUsers();
  openModal({title:"是正計画を登録",okLabel:"登録",body:`
    <div class="field"><label>是正内容</label><textarea class="textarea" id="ra" rows="3"></textarea></div>
    <div class="row-2"><div class="field"><label>是正責任者（選択）</label><select class="select" id="ro">${userOptions()}</select></div>
    <div class="field"><label>期限</label><input class="input" id="rd" type="date"></div></div>`,
    onOk:async(btn)=>{
      const action=val("#ra"), owner=val("#ro");
      if(!action){modalErr("是正内容は必須です");return;}
      if(!owner){modalErr("是正責任者を選択してください");return;}
      btn.disabled=true;
      try{ await A.createRemediation(fid,{action,owner_id:owner,due_at:document.getElementById("rd").value||null}); closeModal(); toast("是正計画を登録しました"); refreshRoute(); }
      catch(e){ modalErr(e.message); btn.disabled=false; }
    }});
}
function openVerifyForm(rid){
  openModal({title:"再確認・完了判定",okLabel:"判定する",body:`
    <div class="field"><label>再確認結果</label><input class="input" id="vr"></div>
    <div class="field"><label>完了証憑</label><input class="input" id="ve"></div>
    <p class="form-hint">完了・継続監視・再指摘の最終判断は監査役が行います（本操作は完了として記録します）。</p>`,
    onOk:async(btn)=>{
      const result=val("#vr");
      if(!result){modalErr("再確認結果は必須です");return;}
      btn.disabled=true;
      try{ await A.verifyRemediation(rid,{result,evidence_note:val("#ve")}); closeModal(); toast("判定を記録しました"); refreshRoute(); }
      catch(e){ modalErr(e.message); btn.disabled=false; }
    }});
}

// ===================== イベント委譲（1箇所で全て処理） =====================
document.addEventListener("click", e=>{
  const navEl=e.target.closest("[data-nav]");
  if(navEl){ e.preventDefault();
    if(navEl.dataset.nav==="requests"&&navEl.dataset.extra) navigate("requests",null,null,navEl.dataset.extra);
    else navigate(navEl.dataset.nav, navEl.dataset.id||null, navEl.dataset.tab||null);
    return; }
  const tabEl=e.target.closest("[data-tab]");
  if(tabEl){ const r=parseHash(); if(r.id){ navigate("engagements", r.id, tabEl.dataset.tab); } return; }
  const modalEl=e.target.closest("[data-modal]");
  if(modalEl){ closeModal(); return; }
  const actEl=e.target.closest("[data-act]");
  if(actEl){ e.preventDefault(); runAction(actEl); return; }
});
window.addEventListener("hashchange", ()=>{ closeModal(); scrollTop(); render(); });

// ===================== 起動 =====================
refreshMe();
</script>
</body>
