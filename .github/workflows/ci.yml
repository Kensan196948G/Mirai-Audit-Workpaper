name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 文書群のリンク整合性（AGENTS.md の CI 相当チェック）
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: リンク検証 (check-links.py)
        run: python3 scripts/check-links.py

  # シークレットスキャン（秘密情報・資格情報のコミット防止）
  secretscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret スキャン (gitleaks CLI)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact

  # アプリ実装（Cloudflare Workers + D1）
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 依存関係インストール
        run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: テスト（単体・統合）
        run: npm test
      - name: ビルド（web + 埋め込み + 型チェック）
        run: npm run build