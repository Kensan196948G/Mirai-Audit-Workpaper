name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-preview:
    # main への push（CI通過後）と手動実行で preview へデプロイ
    runs-on: ubuntu-latest
    environment: preview
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 依存関係インストール
        run: npm ci
      - name: D1 migration（preview / mvp DB）
        run: npx wrangler d1 migrations apply mirai-audit-workpaper-mvp-db -c wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: ビルド＋preview デプロイ
        run: npm run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: スモーク（health）
        run: |
          curl -sf https://mirai-audit-workpaper-preview.kensan1969.workers.dev/api/health || exit 1

  deploy-production:
    # 手動実行のみ（本番は受入基準クリア後に意図的に実行）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 依存関係インストール
        run: npm ci
      - name: D1 migration（production / main DB・冪等）
        run: npx wrangler d1 migrations apply mirai-audit-workpaper-db -c wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: ビルド＋production デプロイ
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: スモーク（health・bootstrap無効確認）
        run: |
          curl -sf https://mirai-audit-workpaper.kensan1969.workers.dev/api/health || exit 1
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://mirai-audit-workpaper.kensan1969.workers.dev/api/admin/bootstrap)
          [ "$CODE" = "403" ] || exit 1
